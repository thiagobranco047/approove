name: CI

on:
  pull_request:
  push:
    branches: [main]

# Repo público: token do workflow só lê. Ações fixadas por SHA (cadeia de suprimentos).
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migração (schema base + migrações novas = schema.prisma)
        run: npm run qa:migration
        env:
          QA_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
      - name: Dependências sem vulnerabilidade crítica em produção
        run: npm audit --omit=dev --audit-level=critical
      - run: npm run build
        env:
          DATABASE_URL: file:./ci.db
      - name: QA de segurança ponta a ponta (next start)
        run: npm run qa:security -- --prod
